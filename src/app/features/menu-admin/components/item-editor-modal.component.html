<div class="fixed inset-0 z-50 flex items-center justify-center p-3 md:p-4 bg-slate-950/70 backdrop-blur-sm animate-fade-in">
  
  <!-- Modal Box -->
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden">
    
    <!-- Header -->
    <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="p-1.5 rounded-lg bg-orange-100 dark:bg-orange-950 text-orange-600 dark:text-orange-400">
          <app-icon name="sliders" [size]="18"></app-icon>
        </span>
        <h3 class="font-bold text-base text-slate-900 dark:text-white">
          {{ isEditing ? 'Edit Dish' : 'Add New Dish' }}
        </h3>
      </div>

      <button
        (click)="close.emit()"
        class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
      >
        <app-icon name="x" [size]="20"></app-icon>
      </button>
    </div>

    <!-- Form Body -->
    <div class="p-5 overflow-y-auto flex-1 space-y-4 text-xs">
      
      <!-- Name & Chinese Name -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="font-bold text-slate-700 dark:text-slate-300">English Dish Name *</label>
          <input
            type="text"
            [(ngModel)]="name"
            placeholder="e.g. Hainanese Chicken Rice"
            class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-700 dark:text-slate-300">Chinese Name (中文名)</label>
          <input
            type="text"
            [(ngModel)]="chineseName"
            placeholder="e.g. 海南鸡饭"
            class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>
      </div>

      <!-- Category, Base Price & Prep Time -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="space-y-1">
          <label class="font-bold text-slate-700 dark:text-slate-300">Category *</label>
          <select
            [(ngModel)]="categoryId"
            class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
          >
            @for (cat of categories(); track cat.id) {
              @if (cat.id !== 'all') {
                <option [value]="cat.id">{{ cat.name }}</option>
              }
            }
          </select>
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-700 dark:text-slate-300">Base Price (SGD) *</label>
          <div class="relative">
            <span class="absolute left-3 top-2 text-slate-400 font-bold">$</span>
            <input
              type="number"
              step="0.10"
              [(ngModel)]="basePrice"
              class="w-full pl-7 pr-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-500 font-mono font-bold"
            />
          </div>
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-700 dark:text-slate-300">Prep Time (mins)</label>
          <input
            type="number"
            [(ngModel)]="preparationTimeMins"
            class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>
      </div>

      <!-- Emoji & Popular Badge -->
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="font-bold text-slate-700 dark:text-slate-300">Icon / Emoji</label>
          <input
            type="text"
            [(ngModel)]="emoji"
            placeholder="e.g. 🍗, 🍜, ☕"
            class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-center text-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-700 dark:text-slate-300">Highlight Badge</label>
          <input
            type="text"
            [(ngModel)]="popularBadge"
            placeholder="e.g. Best Seller, Must Try"
            class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
          />
        </div>
      </div>

      <!-- Description -->
      <div class="space-y-1">
        <label class="font-bold text-slate-700 dark:text-slate-300">Description</label>
        <textarea
          rows="3"
          [(ngModel)]="description"
          placeholder="Dish ingredients, flavor profile..."
          class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
        ></textarea>
      </div>

      <!-- Availability 86 Toggle -->
      <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
        <div>
          <span class="font-bold text-slate-800 dark:text-white block">Stock Status</span>
          <span class="text-[11px] text-slate-500">Enable item for POS ordering</span>
        </div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" [(ngModel)]="isAvailable" class="sr-only peer" />
          <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
        </label>
      </div>

    </div>

    <!-- Footer Actions -->
    <div class="p-4 border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-end gap-3">
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 text-xs font-semibold rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
      >
        Cancel
      </button>
      
      <button
        type="button"
        (click)="onSave()"
        [disabled]="!name || basePrice <= 0"
        [class.opacity-50]="!name || basePrice <= 0"
        class="px-5 py-2 text-xs font-bold rounded-xl bg-orange-600 hover:bg-orange-500 text-white shadow-md shadow-orange-600/20 transition-all cursor-pointer"
      >
        Save Dish
      </button>
    </div>

  </div>

</div>
